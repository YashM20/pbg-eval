[project]
name = "pbg-eval"
version = "0.1.0"
description = "PBG comparison eval harness — FastAPI + Vite/React UI + Autonomous Self-Healing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.139.1",
    "httpx==0.28.1",
    "google-genai==1.31.0",
    "pydantic==2.11.7",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pbg_eval"]
